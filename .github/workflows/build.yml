name: Uygulamayı Derle (Windows + Mac)

# Elle tetikle (Actions sekmesinden "Run workflow") ya da v1.0.0 gibi bir etiket at.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - name: Windows kurulumunu yükle
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Kurulum
          path: dist/*.exe
      - name: Release'e ekle (etiketle tetiklenince)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Mac (.dmg) derle
        run: npx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Mac kurulumunu yükle
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Kurulum
          path: dist/*.dmg
      - name: Release'e ekle (etiketle tetiklenince)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
